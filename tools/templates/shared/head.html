<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${title}</title>
<meta name="description" content="${description}">
<meta name="theme-color" content="${theme_color}">
<link rel="canonical" href="${canonical}">
<meta property="og:type" content="website">
<meta property="og:locale" content="pl_PL">
<meta property="og:title" content="${og_title}">
<meta property="og:description" content="${og_description}">
<meta property="og:url" content="${canonical}">
<meta property="og:image" content="${og_image}">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="${asset_prefix}favicon.png">
<link rel="apple-touch-icon" href="${asset_prefix}apple-touch-icon.png">
${font_preloads}
<link rel="stylesheet" href="${asset_prefix}css/site.css">
<link rel="stylesheet" href="${asset_prefix}css/${stylesheet}">
<script src="${asset_prefix}js/site.js" defer onerror="document.documentElement.setAttribute('data-nav-failed', '')"></script>
<script defer src="${analytics_script_url}" data-website-id="${analytics_website_id}" data-domains="${analytics_domains}"></script>
${structured_data}</head>
