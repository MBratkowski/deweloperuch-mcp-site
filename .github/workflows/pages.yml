name: Pages

# Publishes only the site files (the pages, styles, scripts and assets), not the
# repository's specs, tools or tests, then measures the live pages with Lighthouse.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE: https://mbratkowski.github.io/deweloperuch-mcp-site/

jobs:
  deploy:
    name: Deploy the site files
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Stage the published files
        run: |
          mkdir -p _site/docs
          cp -R index.html css js assets favicon.png apple-touch-icon.png _site/
          cp docs/index.html _site/docs/

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5

  lighthouse:
    name: Lighthouse on the live site (mobile)
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Lighthouse
        run: |
          npx --yes @lhci/cli@0.15.1 collect --config=./lighthouserc.json --url="$SITE" --url="${SITE}docs/"
          npx --yes @lhci/cli@0.15.1 assert --config=./lighthouserc.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-live
          path: .lighthouseci/
          include-hidden-files: true
          if-no-files-found: ignore
