name: Check

on:
  push:
    # The factory's orphan branch of screenshots and scripts holds no site to check.
    branches-ignore: [factory-evidence]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate this commit
    uses: ./.github/workflows/validate.yml
