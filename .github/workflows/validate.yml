name: Validate

# Called by Check and Pages from the caller's own commit. No branch or external
# workflow result can substitute for validation of that run's immutable SHA.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (pytest, Playwright)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest --browser chromium --tracing retain-on-failure --screenshot only-on-failure
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: main-chromium-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  visual:
    name: Visual baselines (pinned Linux Chromium)
    runs-on: ubuntu-24.04
    container:
      # Keep this image, uv.lock and tests/visual/baselines/renderer.json in sync.
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
      options: --ipc=host
    env:
      VISUAL_RENDERER: playwright-1.64.0-noble-amd64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked --python 3.12
      - run: uv run pytest tests/visual -m visual --browser chromium --tracing retain-on-failure
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visual-results
          path: test-results/
          if-no-files-found: error
          retention-days: 14

  browser-smoke:
    name: Browser smoke (Firefox, WebKit)
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked --python 3.12
      - run: uv run pytest tests/e2e/test_browser_smoke.py --browser firefox --browser webkit --tracing retain-on-failure --screenshot only-on-failure
        # GitHub mounts /github/home with another owner; Firefox requires the container user's actual home.
        env:
          HOME: /root
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-smoke-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  generated:
    name: Generated files match the pinned release and the demo data
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      # Check marked and written page facts against the committed snapshots, offline.
      # Latest-release discovery belongs to freshness.yml and sync.yml, never this gate.
      - run: uv run python -m tools.check_facts --pinned
      # List MCP metadata and inspect the pinned CLI; neither invokes data callbacks.
      - run: uv run python -m tools.sync_server --pinned
      - run: uv run python -m tools.build_docs
      # Renders the committed data/demo.json; it never captures (tools/capture_demo.py runs only by hand).
      - run: uv run python -m tools.update_demo
      # Portable source/output digests; do not compare macOS and Linux renderer pixels.
      - run: uv run python -m tools.render_images --check
      - name: Nothing changed
        run: |
          git diff --exit-code
          if [ -n "$(git status --porcelain)" ]; then git status --short; exit 1; fi

  html:
    name: HTML validation (Nu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      # Java and Node.js come with the runner.
      - run: npx --yes --package vnu-jar@26.9.27 vnu --errors-only index.html docs/index.html

  links:
    name: Link check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --no-progress index.html docs/index.html README.md
          fail: true

  lighthouse:
    name: Lighthouse (mobile)
    runs-on: ubuntu-24.04
    # Measures this commit's own files served locally. The live site is measured by
    # pages.yml right after each deployment.
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Package the public site
        run: python3 -m tools.package_site

      - name: Lighthouse
        run: |
          npx --yes @lhci/cli@0.15.1 collect --config=./lighthouserc.json --staticDistDir=./_site --url=http://localhost/ --url=http://localhost/docs/
          npx --yes @lhci/cli@0.15.1 assert --config=./lighthouserc.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci/
          include-hidden-files: true
          if-no-files-found: ignore
