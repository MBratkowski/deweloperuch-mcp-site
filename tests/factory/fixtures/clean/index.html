<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clean fixture</title>
<style>
  body { margin: 0; font: 18px/1.5 system-ui, sans-serif; color: #111; background: #fff; }
  a, button { display: inline-block; min-width: 44px; min-height: 44px; padding: 8px 12px; box-sizing: border-box; color: #0033aa; }
  button { background: #fff; border: 1px solid #111; font: inherit; color: #111; }
  a:focus-visible, button:focus-visible { outline: 2px solid #0033aa; outline-offset: 2px; }
  nav, main, footer, header { padding: 16px; }
  nav a { margin-right: 16px; }
  pre { overflow-x: auto; max-width: 100%; }
</style>
</head>
<body>
<header><p>Fixture site</p></header>
<nav aria-label="Main"><a href="#content">Content</a> <a href="#end">End</a></nav>
<main id="content">
  <h1>Clean page</h1>
  <p>Plain text that wraps and never overlaps anything interactive.</p>
  <button type="button">Press</button>
  <pre>a short command</pre>
</main>
<footer id="end"><p>Footer text</p></footer>
</body>
</html>
